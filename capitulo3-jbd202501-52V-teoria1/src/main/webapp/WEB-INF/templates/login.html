<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Login de Usuario</title>
    </head>
    <body>
    <br/>
    <div class="container">
        <div class="row d-flex justify-content-center mx-auto">
            <h1>Login de usuario</h1>
            <div class="col-md-6 col-xs-12 div-style">
                <form th:action="@{userLogin.cibertec}" method="post">
                    <div class="form-group">
                        Usuario: <input type="text" name="user" class="form-control text-box"
                                        required placeholder="user">
                    </div>
                    <div class="form-group">
                        Clave: <input type="password" name="password" class="form-control text-box"
                                      required placeholder="password">
                    </div>
                    <div class="form-group justify-content-center d-flex">
                        <input type="submit" value="Log-in" class="btn btn-primary button-submit">
                    </div>
                </form>
            </div>
        </div>

        <div class="alert alert-danger" th:if="${mensajeError}">
            <strong th:text="Error!'+${mensajeError}'"></strong>
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>
    </div>
    </body>
</html>
